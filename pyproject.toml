[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "driftproof"
version = "0.2.0"
description = "Independent adversarial release gate for agent-authored dbt repairs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shayan Banerjee" }]
dependencies = [
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dbt = [
  "dbt-core==1.11.14",
  "dbt-duckdb==1.11.0",
  "duckdb==1.5.5",
]
dev = [
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
driftproof = "driftproof.cli:app"
mergeproof = "mergeproof.cli:app"

[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml",
  "/README.md",
  "/src/driftproof",
  "/src/mergeproof",
]

[tool.hatch.build.targets.wheel]
packages = ["src/driftproof", "src/mergeproof"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["driftproof", "mergeproof"]

[tool.coverage.run]
branch = true
source = ["mergeproof"]
